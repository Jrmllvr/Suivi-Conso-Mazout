<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Suivi consommation</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app">
  <section class="top-grid">
    <div class="left-column">
      <section class="panel tank-panel">
        <div class="panel-title">SOLDE CITERNE</div>
        <div id="tankBalance" class="tank-balance">0 L</div>
      </section>
      <button id="addEntryBtn" class="add-btn">+ Ajouter un relevé</button>
    </div>

    <section class="panel annual-panel">
      <div class="panel-title">CONSOMMATION PAR ANNÉE</div>
      <div id="annualTotals" class="annual-list"></div>
      <div id="annualEmpty" class="muted">Aucun relevé</div>
    </section>
  </section>

  <section class="panel entries-panel">
    <div class="panel-title entries-title">RELEVÉS</div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Date</th>
            <th>Relevé</th>
            <th>Consommation</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="entriesBody"></tbody>
      </table>
    </div>
    <div id="entriesEmpty" class="muted empty-state">Aucun relevé enregistré.</div>
  </section>

  <section class="file-actions">
    <button id="importBtn" class="small-btn">Importer Excel</button>
    <button id="exportBtn" class="small-btn">Exporter Excel</button>
    <input id="fileInput" type="file" accept=".xlsx,.xls" hidden>
  </section>

  <section class="conversion">
    <label for="conversionInput">Conversion</label>
    <span>1 cm =</span>
    <input id="conversionInput" type="number" min="0.01" step="0.01">
    <span>L</span>
    <button id="saveConversion" class="tiny-btn">Modifier</button>
  </section>
</main>

<button id="scrollTop" class="scroll-top" aria-label="Remonter en haut">↑</button>

<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
<script src="app.js"></script>
</body>
</html>
